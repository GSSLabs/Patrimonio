
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Patrimônios</title>
</head>

<body>

<h2>Controle de Patrimônio</h2>

<a th:href="@{/patrimonios/novo}">
    Cadastrar novo patrimônio
</a>

<table border="1">

    <thead>
    <tr>
        <th>ID</th>
        <th>Número do Patrimônio</th>
        <th>Descrição</th>
        <th>Local</th>
        <th>Ações</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="item : ${listarPatrimonios}">

        <td th:text="${item.id}"></td>

        <td th:text="${item.nr_patrimonio}"></td>

        <td th:text="${item.descricao}"></td>

        <td th:text="${item.local}"></td>

        <td>
            <a th:href="@{/patrimonios/editar/{id}(id=${item.id})}">
                Editar
            </a>

            <a th:href="@{/patrimonios/excluir/{id}(id=${item.id})}"
               onclick="return confirm('Deseja excluir este patrimônio?')">
                Excluir
            </a>
        </td>

    </tr>

    </tbody>

</table>

</body>
</html>
