spring.application.name=patrimonio
# Configuração de suporte a JSP no spring
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view/suffix=.jsp

# configuracao do banco de dados
spring.datasource.url=jdbc:mysql://localhost:3307/patrimonio_db?useSSL=falseserverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=""
spring.datasource.driver-class_name=com.mysql.cj.jdbc.Driver

# configuracao do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
